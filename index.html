<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>SNS炎上シミュレーター</title>
</head>

<body>
    <header class="header">
        <div class="header-logo">
            <img src="images/ロゴ案3.png" alt="サイトロゴ" id="logo">
        </div>
        <p class="header-title">
        <h1>SNS炎上シミュレーター</h1>
        </p>
    </header>
    <div class="layout">
        <!-- 左側メニュー部分 -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <div class="menu-group">
                    <button class="menu-item">概要</button>
                    <div class="menu-content">
                        <!-- ここに内容記述 -->
                        <p>このサイトは、SNSでの炎上をシミュレーションするためのツールです。ユーザーが投稿した内容に対して、どのような反応が返ってくるかを予測し、炎上のリスクを評価します。</p>
                    </div>
                </div>
                <div class="menu-group">
                    <button class="menu-item">使い方</button>
                    <div class="menu-content">
                        <!-- ここに内容記述 -->
                        <p>使い方の説明をここに記載します。</p>
                    </div>
                </div>
                <div class="menu-group">
                    <button class="menu-item">注意事項</button>
                    <div class="menu-content">
                        <!-- ここに内容記述 -->
                        <p>AIが生成する反応は架空のものであり、現実の反応を保証するものではありません。</p>
                    </div>
                </div>
            </nav>
        </aside>
    </div>

</body>

</html>
